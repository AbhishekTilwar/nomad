# Build the backend image from ./Dockerfile and deploy it to Cloud Run.
# Used by the Cloud Build trigger on pushes to main.
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}:${COMMIT_SHA}
      - -t
      - ${_IMAGE}:latest
      - .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --project=${PROJECT_ID}
images:
  - ${_IMAGE}:${COMMIT_SHA}
substitutions:
  _SERVICE: nomad
  _REGION: europe-west1
  _IMAGE: europe-west1-docker.pkg.dev/cortiq-5f624/cloud-run-source-deploy/nomad/nomad
options:
  # Required when a build runs as a custom service account (the trigger does).
  logging: CLOUD_LOGGING_ONLY
